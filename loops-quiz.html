<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loop Tracing — pyquiz</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="navbar-brand">py<span>quiz</span></a>
        <div class="navbar-right">
            <a href="index.html">Modules</a>
            <a href="#">Leaderboard</a>
            <button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme">☀️</button>
        </div>
    </nav>

    <div class="container">
        <h1>Loop Tracing</h1>

        <div id="introduction">
            <img src="robot.png" class="intro-mascot" alt="mascot">
            <div class="intro-text">
                <p>Step through for and while loops and predict the output.</p>
                <button onclick="startQuiz()">Start Quiz</button>
            </div>
        </div>

        <div class="progress-wrap" id="progressWrap" style="display:none;">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div class="quiz-hud" id="quizHud" style="display:none;">
            <div class="hud-item">
                <span class="hud-label">Question</span>
                <span class="hud-value" id="hudQuestion">1 / 10</span>
            </div>
            <div class="hud-item">
                <span class="hud-label">Score</span>
                <span class="hud-value accent" id="hudScore">0</span>
            </div>
        </div>

        <div id="quiz" style="display:none;"></div>
        <div class="result" id="result"></div>
        <div class="score" id="score"></div>
        <button id="nextQ" style="display:none;" onclick="nextQuestion()">Next question →</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="quiz-engine.js"></script>
    <script src="loops-quiz.js"></script>
    <script>
        function toggleTheme() {
            const isDark = document.body.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            document.querySelector('.theme-toggle').textContent = isDark ? '🌙' : '☀️';
        }
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark');
            document.querySelector('.theme-toggle').textContent = '🌙';
        }
    </script>
</body>
</html>
